name: Deploy with Environments

on:
  push:
    branches: [ main ]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Print Staging Environment
        run: echo "Deploying to STAGING with API_KEY=${{ secrets.API_KEY }}"

  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Print Production Environment
        run: echo "Deploying to PRODUCTION with API_KEY=${{ secrets.API_KEY }}"
