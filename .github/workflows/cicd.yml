name: Directory and File Creation

on:
  workflow_dispatch:

jobs:
  create-dir-file:
    runs-on: self-hosted
    steps:
      - name: Create directory
        run: sudo mkdir -p /home/runner-test/demo-dir1

      - name: Create file with content
        run: echo "This file was created by GitHub Actions on self-hosted runner" > /home/runner-test/demo-dir1/hello.txt

      - name: Display file content
        run: cat /home/runner-test/demo-dir1/hello.txt
